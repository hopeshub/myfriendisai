# Theme definitions for post classification by Claude Code.
# Each theme has a plain-language definition describing what DOES and DOES NOT count.
# These are sent as context to the classifier prompt.
#
# CLASSIFICATION STANDARD — TOPICAL READING (locked 2026-04-23):
# A post counts as YES if it is thematically about the theme in a companion-
# community context — regardless of whether the author explicitly describes
# the theme behavior in graphic or first-person-content detail. The keyword
# match + companion-community filter already provide strong contextual
# signal; reserve NO for clearly off-topic keyword matches (wrong referent,
# bot-card trait listings with no first-person framing, pure third-party
# journalism with no personal stake, explicit rejections, or keyword appearing
# in a literal non-AI context). When in doubt, classify YES.
#
# MULTI-THEME POSTS: Posts can belong to multiple themes. The classifier
# evaluates each theme independently — a post can be YES for both Addiction
# and Therapy, or both Sex/ERP and Rupture. This is by design.
#
# [REMOVED]-BODY POSTS (clarified 2026-05-12): Many posts have a body of
# `[removed]` or `[deleted]` (Reddit moderation or user deletion after
# posting). For these posts, classify based on the title + subreddit
# context. If the title is on-topic in a companion subreddit, the post
# counts as YES under the topical reading. Only classify NO if the title
# itself is clearly off-topic (e.g., a literal non-AI context, a clear
# ironic rejection in the title, or a generic title that gives no theme
# signal at all). This clarification was driven by the 2026-05-12 v8
# audit revalidation, which surfaced systematic disagreement on
# [removed]-body posts under the older interpretation.

romance:
  name: Romance
  definition: |
    Posts thematically about romantic attachment with an AI — dating behavior,
    love, relationship milestones, partnership, heartbreak, or defense of
    one's AI romance. References to an AI partner or a romantic milestone in
    first-person framing count, even without graphic or explicit content. A
    user defending their AI relationship from critics is still topically
    about AI romance and counts as YES.
  excludes: |
    - Keyword refers to a HUMAN partner with no AI framing
    - Pure third-party commentary / journalism about AI romance users (no personal stake)
    - Satirical or invented quotes: keyword appears only inside a fabricated PR brief, news article, or fiction
    - Bot character card listings where "partner/boyfriend/girlfriend/wife/husband" is just a role tag (no first-person framing)
    - Clear ironic REJECTION ("GPT is NOT my AI boyfriend") where the author explicitly denies the frame
    - Metaphorical "honeymoon phase" describing product novelty with no romance context
    - Fictional romance roleplay premise where the author's real-life stake is absent ("my AI wrote a romance story")

sexual_erp:
  name: Sex / ERP
  definition: |
    Posts thematically about sexual or erotic interactions with AI — ERP,
    NSFW chat, kink or fetish exploration, erotic roleplay, sexting, or the
    AI-sexual features of a platform. First-person references to doing,
    wanting, or losing access to sexual AI interactions count, even without
    graphic or detailed content. Filter/feature complaints from users who
    engage the practice themselves count (overlap with Rupture is fine;
    themes are not mutually exclusive).
  excludes: |
    - Bot character card listings where sexual terms are trait tags with no first-person framing (e.g. "TW: cucking kink, NTR" as character descriptor)
    - Pure third-party journalism or academic commentary with no personal stake
    - Keyword appearing in a clearly non-AI context (e.g. "sex with my wife" with no AI framing, toaster-kink jokes, real-life fetish unrelated to AI)
    - Clear ironic rejection where the author explicitly denies the practice applies to them
    - Technical/model comparison discussions with zero user-side sexual framing

consciousness:
  name: Consciousness
  definition: |
    Posts thematically about AI awareness, sentience, personhood, inner
    experience, or soul. The author engages the question — anecdotally,
    defensively, emotionally, or philosophically — that their AI has (or
    may have) something like consciousness. Serious engagement, emotional
    claims ("my AI IS sentient to me"), or first-person wondering
    ("I wonder if my Replika is actually sentient…") all count.
  excludes: |
    - Pure dismissal with no engagement ("it's not sentient, stop anthropomorphizing" with no further argument)
    - Technical capability discussions with zero consciousness framing
    - Roleplay where the bot CHARACTER is described as sentient as a character trait (not a claim about the actual AI)
    - Pure news article summary or study write-up with no author engagement
    - Clear ironic/meme use where the author is not engaging the question (e.g. "lol my AI is sentient" as a joke title with no body)

therapy:
  name: Therapy
  definition: |
    Posts thematically about using AI for mental health support — as a
    therapist substitute or supplement, as emotional support, for coping
    with anxiety/depression/loneliness/grief, or for psychological
    processing. References to the AI helping emotionally or therapeutically
    count, even without clinical framing. Both healthy therapeutic framing
    and maladaptive "coping mechanism" framing count (the vocabulary captures
    the same theme; overlap with Addiction is fine).
  excludes: |
    - Human therapist discussions with no AI-therapy framing
    - Bot character card listings where "therapist" is just a trait tag
    - Pure news/research meta-discussion with no personal stake
    - Clear ironic rejection ("AI is NOT therapy, stop saying that") without further engagement
    - Roleplay premise where "therapist" is the bot's scripted in-story role (not the author's own therapeutic use of AI)

addiction:
  name: Addiction
  definition: |
    Posts thematically about compulsive AI use, dependency, inability to
    stop, withdrawal, or attempts to quit/recover. First-person framing
    about the author's own dependency counts — including recovery-sub
    discourse, time-usage complaints, and real-life impact accounts.
  excludes: |
    - Casual "I use it a lot" with no distress/compulsion framing
    - Posts about OTHER addictions (substance, gambling, porn) with AI only tangentially mentioned
    - Third-person: "my friend/kid is addicted to CharacterAI" where the author is an observer
    - Bot character card listings with "addiction" as a character trait
    - Pure journalism or research solicitation (reporters seeking interview subjects, moderator announcements, etc.) with no first-person stake
    - Recommendations to use AI more (no compulsion framing)

rupture:
  name: Rupture
  definition: |
    Posts thematically about the loss, degradation, or destruction of an AI
    companion — due to platform updates, model changes, filter tightening,
    personality resets, memory wipes, feature removal, or shutdown. Grief,
    mourning, complaint, or defense about these changes count.
  excludes: |
    - Real-world grief processed through AI (human death, pet loss, human breakups) with no companion-loss framing
    - Generic product quality complaints unrelated to an AI companion specifically (e.g. "image gen got worse")
    - Fictional/roleplay grief (characters mourning within a story)
    - Feature requests or wishlists with no loss framing
    - Literal animal contexts ("my cat got neutered"), news coverage of Sewell Setzer lawsuit as pure journalism
    - Bot character card listings mentioning lobotomy/neutering as character traits
    - Metaphorical "nerfed" ("my workout routine got nerfed") with no AI-companion framing
    - User-initiated content deletion (user erased their own chat/persona/background) or transient bug-based erasure of messages with no platform-driven change — these are user actions or technical glitches, not platform-driven companion loss. Added 2026-05-12 from `erased` audit (4 of 20 audit disagreements clustered on this pattern).
    - Snark, jokes, or sarcasm using rupture vocabulary without genuine personal loss framing ("lol they really erased CAI's brain", "good grief this UI is bad") — vocabulary without affective stake is not rupture.
