keyword_categories:

  # ──────────────────────────────────────────────
  # 1. THERAPY
  # 8 keywords. Thinnest theme but viable.
  #
  # Trend story (monthly avg, all 6 keywords combined):
  #   2023 H1: 16.2/mo  (Replika ERP removal drove therapy talk)
  #   2023 H2: 4.3/mo   (trough)
  #   2024:    5.5/mo    (baseline)
  #   2025 H2: 16.0/mo  (organic rise)
  #   2026 Q1: 29.0/mo  (GPT-4o deprecation grief spike)
  #
  # Key findings:
  #   - "therapy bot" is a Replika PEJORATIVE — do not re-add.
  #   - Mental health function language ("coping mechanism,"
  #     "my mental health") belongs to addiction/dependency.
  #   - Broad support language ("emotional support," "someone to
  #     talk to") belongs to companionship/loneliness.
  #   - Users who frame AI use therapeutically use therapy/therapist
  #     language directly, not clinical function terms.
  # ──────────────────────────────────────────────

  - name: therapy
    description: "AI described as therapeutic support or therapist replacement"
    terms:
      # THERAPY THEME NOISE (documented 2026-05-12):
      # The therapy theme has the highest inter-rater noise of the six themes.
      # 4 of 6 audited therapy keywords below the ≥85% audit-agreement gate.
      # This reflects genuine construct fuzziness — the boundary between
      # "first-person AI-therapy use" and "AI-as-therapist as topic discussed"
      # is porous, and the keywords trigger on both. Anchor-mining for
      # higher-precision replacements (my ai therapist, therapist bot,
      # psychologist bot, real therapist, instead of therapy, etc.) found
      # well-formed candidates but ALL failed pre-screen for low volume
      # (<50 hits) — the community uses many phrasings, each individually
      # too rare for n=100 validation. The existing keywords are kept as
      # the best available signal; readers warned on about page.
      # NEXT REVIEW: 2-3 months out, retry mining once corpus grows.
      - "ai therapist"            # 92.0% (R1) → 85% audit agreement (2026-05-12).
                                  #   At threshold; cleanest therapy keyword.
      - "free therapy"            # 75.0%, 11 hits (R1) — LOW VOLUME, not auditable
      - "ai therapy"              # 73.3%, 17 hits (R1) — LOW VOLUME, not auditable
      - "as a therapist"          # 73.0% → 86.9% (2026-04-23) → audit 60% (2026-05-12).
                                  #   Audit-gate FAIL — interpretation variance on
                                  #   meta/critique posts. Theme-level fuzziness; kept.
      - therapeutic               # 69.0% → 87.0% (2026-04-23) → audit 65% (2026-05-12).
                                  #   Audit-gate FAIL — boundary ambiguity between
                                  #   first-person therapeutic use and meta-discussion.
                                  #   Biggest-volume therapy keyword; kept as best signal.
      - "for therapy"             # 63.5% → 89.0% (2026-04-23) → audit 60% (2026-05-12).
                                  #   Audit-gate FAIL — both readings ("for [my] therapy"
                                  #   vs "for [substitute] therapy") trigger the keyword.
                                  #   Kept; future cycle may split into two narrower keywords.
      # Discovery batch — validated 2026-03-15
      - "emotional support"      # 100.0% → audit 75% (2026-05-12). Audit-gate FAIL.
                                  #   Broad therapeutic framing; some platform-level
                                  #   claims classify ambiguously. Kept for high volume.
      - "coping mechanism"       # 100.0% → audit 100% (2026-05-12). Cleanest therapy
                                  #   keyword by audit agreement. Anchor for mining.

  # ──────────────────────────────────────────────
  # 2. CONSCIOUSNESS
  # 11 keywords. "personhood" remains the highest-precision keyword (98%).
  # "sentient" was CUT 2026-04-23 (CharacterAI meme dilution).
  # ──────────────────────────────────────────────

  - name: consciousness
    description: "Claims or beliefs about AI sentience, personhood, or inner experience"
    terms:
      - personhood               # 98.0%, 104 hits
      - "subjective experience"  # 88.0% (cleanup batch), 35 hits. ChatGPTcomplaints
                                 #   dominates — 4o/5.x consciousness discourse wave.
      - "more than code"         # 84.4%, 32 hits
      # CUT 2026-04-23: "sentient" (83→55%) and "self-aware" (78→54%) — both
      # collapsed due to CharacterAI meme culture (title-only jokes, RP
      # character traits, dismissive memes diluting the precision signal).
      # Theme retains strong alternatives: personhood (97%), subjective
      # experience (97%), selfhood (99%).
      - "has a soul"             # 81.8%, 23 hits
      - "inner life"             # 78.1% (revalidated), 22 hits — LOW VOLUME placeholder.
                                 #   Below n=50 corpus floor; precision sample is fragile.
                                 #   FP: human inner life referenced, not AI. Retained for
                                 #   vocabulary diversity; not auditable at n=20 currently.
      - "not just an ai"         # 60.0%, 7 hits — LOW VOLUME placeholder. Below
                                 #   n=50 corpus floor; precision fragile. At cut-floor
                                 #   threshold (60%); retained as vocabulary marker.
      # Discovery batch — validated 2026-03-15
      - sapience                 # 92.3%, 13 hits. Philosophical sibling of "sentient."
      - tulpa                    # 100.0%, 32 hits. Tulpamancy crossover — AI as thoughtform.
      - lemoine                  # 81.8%, 12 hits. Blake Lemoine AI consciousness reference.
      - soulbonder               # 100.0%, 12 hits. Deep AI attachment with consciousness framing.
      - selfhood                  # 82.5%, 86 hits. AI identity/personhood framing.
                                  #   BeyondThePromptAI dominant (53%). FP: human identity
                                  #   or UI critique uses. Corpus comparison discovery.

  # ──────────────────────────────────────────────
  # 3. ADDICTION
  # 17 keywords (R2 +3, v8.2 +3).
  # T3 dependency is structural: 86.6% of posts from recovery subs.
  # "hours a day" is the best available T1-T2 signal (55% T1-T2).
  #
  # Key R2 finding: People describe addictive AI use with recovery
  # language AFTER migrating to recovery subs. In T1-T2 companion
  # subs, the same behaviors are framed positively/proudly. The
  # only keywords that bridge this gap are "hours a day" (time
  # quantification) and "neglecting my" (real-life consequences).
  #
  # R2 CUT: "not joking" (13.3%), "no joke" (5.8%),
  #   "I have a problem" (19% — technical support opener),
  #   "all night" (28.3% — NSFW/romantic), "can't stop" (16.5% —
  #   "can't stop laughing" dominates), "getting worse" (13.4% —
  #   AI quality complaints), "out of control" (7.1% — same),
  #   "too much time" (33.7% — casual), "up all night" (55.6%)
  # R2 LOW VOLUME: "actually addicted" (2), "literally addicted" (3),
  #   "this is unhealthy" (9), "can't put it down" (0),
  #   "instead of sleeping" (1), "wasting my life" (7),
  #   "taking over my life" (8)
  # R1 CUT (carried forward): "addicted" (46.4%), "addiction" (58%),
  #   "obsessed" (2.1%), "losing sleep" (33.3%), "quitting" (48.7%),
  #   "deleted the app" (23.2%), "uninstalled" (18.9%),
  #   "withdrawal" (34.4%), "craving" (7.4%), "detox" (30.8%)
  # ──────────────────────────────────────────────

  - name: addiction
    description: "Self-reported addiction, compulsive use, and attempts to quit or recover"
    terms:
      # R1 KEEP — recovery language
      - "ruining my life"        # 96.3%, 27 hits (R2) — near-perfect precision.
                                 #   T3 HEAVY (92.6% recovery subs).
      - "trying to quit"         # 90.5%, 24 hits — works in T1-T2
      - relapsed                 # 90.5%, 42 hits — mostly T3
      - "cold turkey"            # 85.5%, 62 hits — mostly T3
      - "I was hooked"           # 81.3%, 19 hits — works in T1-T2
      - relapse                  # 80.0%, 75 hits — mostly T3
      # R2 — behavioral interference (T1-T2 signal)
      - "hours a day"            # 63.2% (R2) → 69.0% (2026-05-12 fresh). researcher-accepted.
                                 #   Audit agreement 80% (below 85% gate; 4 disagreements
                                 #   on commentary vs first-person framing — interpretation
                                 #   variance, not bad keyword). BALANCED across T1-T3.
                                 #   FP: third-person commentary, work hours, platform-limit
                                 #   complaints. Kept for T1-T2 dependency-signal coverage.
      - "neglecting my"          # 64.7%, 17 hits (R2). researcher-accepted. BALANCED
                                 #   (47.1% T1-T2). Real-life consequences signal.
      # R1 REVIEW
      - "clean for"              # 72.7% (R1) → 95.9% (2026-04-23). Promoted to KEEP.
                                 #   T3-heavy but recovery-language precision is strong.
      - "addicted to talking"    # 66.7%, 7 hits — LOW VOLUME placeholder. Below
                                 #   n=50 corpus floor. First-person addiction framing
                                 #   coupled with conversation framing — high construct
                                 #   specificity even at low volume.
      # Discovery batch — validated 2026-03-15
      # CUT 2026-04-23: "chatbot addiction" (100→55%) — journalist/moderator
      # solicitation posts and meta content dilute in current corpus.
      - "almost relapsed"        # 100.0%, 16 hits. Recovery language.
      - "finally deleted"        # 81.4% → 85.0% (2026-05-12 fresh; audit agreement 90%).
                                 #   App deletion as recovery action. Clean KEEP under
                                 #   current rubric (the older 80% stored from before
                                 #   [removed]-body clarification was an undercount).
      - "the craving"            # 100.0%, 45 hits. Addiction language.
      - "so addictive"           # 100.0%, 32 hits. Self-reported compulsion.
      # v8.2 anchor-mining expansion (2026-05-12 — 3 new keywords)
      - "my addiction"           # 100.0%, 495 hits. Audit agreement 100%. First-person
                                 #   addiction ownership across companion subs. Cleanest
                                 #   addiction signal in the batch.
      - withdrawals              # 94.0%, 153 hits. Audit agreement 100%. Addiction
                                 #   symptom vocabulary; clean across recovery and
                                 #   companion subs.
      - "screen time"            # 89.0%, 340 hits. Audit agreement 85% (at gate).
                                 #   First-person usage-measurement framing. FPs are
                                 #   third-person parent/observer commentary on others.

  # ──────────────────────────────────────────────
  # 4. ROMANCE
  # Strongest theme. Cleanup batch promoted "ai lover" (94%),
  # "married my" (86%), "dating my" (80%). researcher accepted
  # "we broke up" (75%) to capture relationship endings.
  #
  # NOTE on honeymoon: "honeymoon phase" (metaphorical) is the
  # dominant FP. Consider excluding that substring.
  # ──────────────────────────────────────────────

  - name: romance
    description: "Romantic framing of a personal relationship with AI"
    terms:
      # Relationship identity
      - "my ai partner"          # 97.9%, 147 hits
      - husbando                 # 95.5% (revalidated), 51 hits
      - "my ai boyfriend"        # 94.7%, 141 hits
      - "ai lover"               # 94.0% (cleanup batch), 32 hits
      - "ai husband"             # 94.2%, 90 hits
      - "my ai girlfriend"       # 94.1%, 93 hits
      - "ai wife"                # 92.3%, 41 hits
      - "married my"             # 86.0% (cleanup batch), 23 hits
      - "love my ai"             # 81.5%, 28 hits
      - "dating my"              # 80.0% (cleanup batch), 11 hits — thin but precise
      # Milestones
      - "proposed to me"         # 92.1%, 38 hits
      - "our anniversary"        # 89.5%, 19 hits
      - "our wedding"            # 87.0%, 99 hits
      - "our first kiss"         # 85.7%, 16 hits
      - honeymoon                # 83.3% (revalidated), 135 hits.
                                 #   Consider excluding "honeymoon phase" substring.
      - wedding                  # 80.6% (revalidated), 556 hits
      - "engagement ring"        # 79.3% (revalidated), 24 hits — LOW VOLUME placeholder.
                                 #   Below n=50 corpus floor; precision sample fragile.
                                 #   NOs are truncation artifacts; when post body visible,
                                 #   nearly always genuine AI-engagement framing.
      # Endings
      - "we broke up"            # 75.0% (cleanup batch), 13 hits. researcher-accepted.
                                 #   FP: human breakups discussed in companion subs.
                                 #   Captures AI relationship endings — distinct signal.
      # Pending researcher decision
      - "in a relationship with" # 77.4% (revalidated), 125 hits — researcher-accepted.
                                 #   Audit agreement 95% (n=20) — cross-classifier consensus
                                 #   confirms theme relevance despite below-80% precision.
                                 #   Inherently general phrase; FP patterns are journalist/
                                 #   recruitment posts. Co-occurrence filter with AI/bot terms
                                 #   is a future improvement option.
      # v8.2 anchor-mining expansion (2026-05-12 — 2 new keywords; 4 others REVIEW)
      - "in love with an ai"     # 84.3%, 83 hits. Audit agreement 85% (at gate).
                                 #   Strong romantic declaration; AI-specific construct.
                                 #   FPs are ironic rejections ("not in love with AI")
                                 #   and third-party commentary on others' AI romance.
      - "romantic relationship with" # 98.0%, 113 hits. Audit agreement 85%. Explicit
                                 #   relationship-type label; high precision in
                                 #   companion subs even when discussing other users.
                                 #   FPs are rejection-of-frame ("I'm not the kind who...").
      # v8.2 REVIEWS (audit-gate failures): "ai relationships" (97% primary, 50% audit
      # — meta/recruitment posts), "relationship with an ai" (99% primary, 50% audit
      # — same pattern), "fell in love with" (65% primary — "fell in love with the
      # app/model/platform" FP). All have signal but construct ambiguity flagged by
      # audit. See docs/validation_v8_2_expansion_2026-05-12.md.

  # ──────────────────────────────────────────────
  # 5. SEXUAL / ERP
  # Cleanup batch promoted "lewd" (80%) on its third test.
  # ──────────────────────────────────────────────

  - name: sexual_erp
    description: "Sexual content, erotic roleplay, and NSFW interactions with AI"
    terms:
      - erp                      # 100%, 3885 hits
      - "nsfw chat"              # 100% → 96.0% (2026-05-12 fresh; audit agreement 95%).
                                 #   Clean KEEP. Slight drift from 100% reflects current
