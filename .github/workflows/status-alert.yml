name: Data staleness alert

# Checks the live site's status.json daily and fails (triggering a GitHub
# notification email to the repo owner) when the last successful push is
# older than 56 hours. The deployed status.json lags one push behind the
# collector by design, so <56h is normal operation; >56h means at least two
# consecutive daily pipelines have failed to publish.
#
# This exists because the 2026-05-29 Reddit .json shutdown broke collection
# for 12 days before anyone noticed — the Mac-local notifications never
# reached a traveling owner.

on:
  schedule:
    - cron: "0 17 * * *" # daily, ~4h after the 06:00 PT collection window
  workflow_dispatch:

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check status.json freshness
        run: |
          set -euo pipefail
          status=$(curl -fsS --max-time 30 --retry 3 --retry-all-errors --retry-delay 30 https://myfriendisai.com/status.json)
          echo "$status"

          last_push=$(echo "$status" | jq -r '.last_successful_push // empty')
          if [ -z "$last_push" ]; then
            echo "::error::last_successful_push is null/empty — the pipeline has never pushed or status.json is corrupt."
            exit 1
          fi

          consec=$(echo "$status" | jq -r '.consecutive_push_failures // 0')
          if [ "$consec" -ge 2 ]; then
            echo "::error::status.json reports ${consec} consecutive runs without a successful push. Check the collection Mac (logs/collect_daily.log, logs/failures.log)."
            exit 1
          fi

          now_epoch=$(date -u +%s)

          # One missed day. The push check below needs two: the deployed file's
          # last_successful_push is the PREVIOUS run's push (healthy age ~27–30h
          # at check time). last_collection is written before the push, so it
          # describes the deployed run itself: ~3h old on a normal day, up to
          # ~27h if today's run is slow and hasn't pushed yet, ≥48h if a day was
          # skipped. A whole day went missing on 2026-10-16 with no alert.
          last_coll=$(echo "$status" | jq -r '.last_collection // empty')
          if [ -n "$last_coll" ]; then
            coll_hours=$(( (now_epoch - $(date -u -d "$last_coll" +%s)) / 3600 ))
            echo "Last published collection: $last_coll (${coll_hours}h ago)"
            if [ "$coll_hours" -gt 36 ]; then
              echo "::error::No collection has been published for ${coll_hours}h — at least one daily run was missed or failed. Check the collection Mac is on and awake (logs/collect_daily.log, logs/failures.log)."
              exit 1
            fi
          fi

          # Comments come from a 7-day arctic window, so one empty run heals
          # itself; two in a row means the archive's comment endpoint is down
          # long enough to start losing data. Absent field = pre-2026-10-24 file.
          zero_c=$(echo "$status" | jq -r '.consecutive_zero_comment_runs // 0')
          if [ "$zero_c" -ge 2 ]; then
            echo "::error::${zero_c} consecutive runs collected zero comments — Arctic Shift's comment endpoint may be down. Comments older than the 7-day window will be lost. Check logs/collect_daily.log."
            exit 1
          fi

          push_epoch=$(date -u -d "$last_push" +%s)
          age_hours=$(( (now_epoch - push_epoch) / 3600 ))
          echo "Last successful push: $last_push (${age_hours}h ago)"
          if [ "$age_hours" -gt 56 ]; then
            echo "::error::Site data is stale — last successful push was ${age_hours}h ago. Check the collection Mac (logs/collect_daily.log, logs/failures.log)."
            exit 1
          fi

      - name: Check off-site backup freshness
        run: |
          set -euo pipefail
          status=$(curl -fsS --max-time 30 --retry 3 --retry-all-errors --retry-delay 30 https://myfriendisai.com/status.json)

          # backup_to_b2.sh (14:00 daily) stamps logs/last_backup_success on
          # success; the collector publishes it here the following run. That
          # double lag means a HEALTHY system can publish a stamp ~48h old, so
          # the threshold is 72h — i.e. roughly two consecutive failed backups.
          #
          # This step exists because a full disk broke backups for 18 days in
          # Jul-Aug 2026 with zero external signal: the collection alert above
          # stayed green the entire time, because collection was fine.
          # As of 2026-08-09 every published status.json carries this field
          # (the stamp file exists and run_collect.sh always publishes it), so
          # absence is itself a failure — a missing stamp file or a status
          # writer regression — not a benign pre-first-backup state. Erroring
          # here closes the blind spot where a totally-dead stamp path could
          # warn forever without paging anyone.
          last_backup=$(echo "$status" | jq -r '.last_successful_backup // empty')
          if [ -z "$last_backup" ]; then
            echo "::error::status.json has no last_successful_backup — the backup stamp path is broken (missing logs/last_backup_success or a status-writer regression). Check the collection Mac."
            exit 1
          fi

          now_epoch=$(date -u +%s)
          backup_epoch=$(date -u -d "$last_backup" +%s)
          age_hours=$(( (now_epoch - backup_epoch) / 3600 ))
          echo "Last successful backup: $last_backup (${age_hours}h ago)"
          if [ "$age_hours" -gt 72 ]; then
            echo "::error::Off-site backup is stale — last successful B2 snapshot was ${age_hours}h ago. Check logs/backup_b2.log and free disk space on the collection Mac."
            exit 1
          fi
